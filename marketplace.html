<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | ToolzHub-Prime</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
    <div class="animated-bg">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
    </div>

    <!-- Simplified Navigation -->
<nav class="navbar" id="navbar">
    <div class="nav-container">
        <div class="logo" onclick="window.location.href='index.html'">
            <img src="icon-192.png" alt="ToolzHub" class="logo-img">
            <span class="logo-text">TOOLZ<span class="highlight">HUB</span></span>
        </div>
        
        <div class="nav-menu" id="navMenu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="marketplace.html" class="nav-link">Marketplace</a>
            <a href="wallet.html" class="nav-link">Wallet</a>
            <a href="support.html" class="nav-link">Support</a>
        </div>

        <div class="nav-actions">
            <select id="currencySelect" onchange="changeCurrency(this.value)" class="currency-select">
                <option value="NGN">₦ NGN</option>
                <option value="USD">$ USD</option>
                <option value="GBP">£ GBP</option>
                <option value="EUR">€ EUR</option>
            </select>
            
            <button class="btn-icon" onclick="toggleTheme()" title="Toggle Theme">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
            
            <button class="btn-cart" onclick="toggleCart()">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="cartCount">0</span>
            </button>
            
            <button class="btn-primary" id="authBtn" onclick="toggleAuthModal()">
                <i class="fas fa-user"></i> <span>Get Started</span>
            </button>
        </div>
        
        <button class="mobile-toggle" onclick="toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>
    </div>
</nav>
    <main class="marketplace-page">
        <div class="container">
            <!-- Page Header -->
            <div class="page-header" data-aos="fade-down">
                <h1>Marketplace</h1>
                <p class="text-muted">Browse our premium digital assets</p>
            </div>

            <!-- Search & Filters -->
            <div class="marketplace-controls" data-aos="fade-up">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search products..." oninput="filterProducts()">
                </div>
                
                <div class="category-filters">
                    <button class="filter-btn active" onclick="filterByCategory('all')">
                        <i class="fas fa-th"></i> All
                    </button>
                    <button class="filter-btn" onclick="filterByCategory('proxy')">
                        <i class="fas fa-network-wired"></i> Proxies
                    </button>
                    <button class="filter-btn" onclick="filterByCategory('logs')">
                        <i class="fas fa-database"></i> Logs
                    </button>
                    <button class="filter-btn" onclick="filterByCategory('blueprint')">
                        <i class="fas fa-file-code"></i> Blueprints
                    </button>
                    <button class="filter-btn" onclick="filterByCategory('update')">
                        <i class="fas fa-sync-alt"></i> Updates
                    </button>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="products-grid-modern" id="productsGrid">
                <div class="loading-grid">
                    <div class="skeleton-product"></div>
                    <div class="skeleton-product"></div>
                    <div class="skeleton-product"></div>
                </div>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-box-open"></i>
                <h3>No products found</h3>
                <p>Try adjusting your search or filters</p>
                <button class="btn-secondary" onclick="filterByCategory('all')">
                    <i class="fas fa-sync-alt"></i> Reset Filters
                </button>
            </div>
        </div>
    </main>

    <!-- Cart Slide-over Modal -->
    <div class="modal modal-side" id="cartModal">
        <div class="modal-content-side">
            <div class="modal-header">
                <h3><i class="fas fa-shopping-cart"></i> Shopping Cart</h3>
                <button class="modal-close" onclick="toggleCart()">&times;</button>
            </div>
            <div id="cartItems" class="cart-items-modern">
                <div class="empty-cart">
                    <i class="fas fa-shopping-cart"></i>
                    <p>Your cart is empty</p>
                    <a href="#products" class="btn-secondary" onclick="toggleCart()">
                        <i class="fas fa-arrow-left"></i> Continue Shopping
                    </a>
                </div>
            </div>
            <div id="cartFooter" class="cart-footer-modern" style="display: none;">
                <div class="cart-summary">
                    <span>Total:</span>
                    <span class="total-amount">₦<span id="cartTotal">0</span></span>
                </div>
                <button class="btn-checkout" onclick="checkout()">
                    <i class="fas fa-credit-card"></i> Proceed to Checkout
                </button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="app.js"></script>
    <script src="marketplace.js"></script>
</body>
</html>
