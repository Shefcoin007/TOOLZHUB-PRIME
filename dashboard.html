<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Same head as index.html -->
  <title>Dashboard | ToolzHub-Prime</title>
</head>
<body>
  <!-- Same navbar -->
  
  <main class="dashboard">
    <div class="container">
      <!-- Welcome + Balance -->
      <div class="dashboard-header">
        <h1>Welcome, <span id="userName">User</span> 👋</h1>
        <div class="balance-card">
          <span class="balance-label">Available Balance</span>
          <div class="balance-amount">
            <span class="currency">₦</span><span id="userBalance">0.00</span>
          </div>
          <div class="balance-points">
            <i class="fas fa-gift"></i> <span id="userPoints">0</span> Points
          </div>
          <div class="balance-actions">
            <button class="btn-primary" onclick="window.location.href='wallet.html'">
              <i class="fas fa-plus"></i> Add Funds
            </button>
            <button class="btn-secondary" onclick="redeemPoints()">
              <i class="fas fa-exchange-alt"></i> Redeem Points
            </button>
          </div>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <i class="fas fa-shopping-bag"></i>
          <span class="stat-value" id="totalOrders">0</span>
          <span class="stat-label">Total Orders</span>
        </div>
        <div class="stat-card">
          <i class="fas fa-check-circle"></i>
          <span class="stat-value success" id="completedOrders">0</span>
          <span class="stat-label">Completed</span>
        </div>
        <div class="stat-card">
          <i class="fas fa-coins"></i>
          <span class="stat-value" id="totalSpent">₦0</span>
          <span class="stat-label">Total Spent</span>
        </div>
        <div class="stat-card">
          <i class="fas fa-ticket-alt"></i>
          <span class="stat-value warning" id="openTickets">0</span>
          <span class="stat-label">Open Tickets</span>
        </div>
      </div>

      <!-- Recent Orders -->
      <div class="section">
        <div class="section-header">
          <h2>Recent Orders</h2>
          <a href="marketplace.html" class="btn-link">View All →</a>
        </div>
        <div id="recentOrders" class="orders-list"></div>
      </div>

      <!-- Quick Actions -->
      <div class="quick-actions">
        <a href="marketplace.html" class="action-card">
          <i class="fas fa-store"></i>
          <span>Browse Marketplace</span>
        </a>
        <a href="wallet.html" class="action-card">
          <i class="fas fa-wallet"></i>
          <span>Manage Wallet</span>
        </a>
        <a href="support.html" class="action-card">
          <i class="fas fa-headset"></i>
          <span>Get Support</span>
        </a>
        <a href="#" class="action-card" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </a>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
